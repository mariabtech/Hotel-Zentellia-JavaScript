<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<title>Hotel ZENTELLIA — Gestão de Eventos</title>
	<script>
		const NOME_HOTEL = sessionStorage.getItem("nome_hotel") || "ZENTELLIA";

		function obter_estado() {
			var salvo = sessionStorage.getItem("estado_hotel");
			if (salvo) return JSON.parse(salvo);
			return {
				autenticado: true,
				usuario_logado: "Operador",
				quartos: [],
				reservas_confirmadas: [],
				lista_hospedes: [],
				eventos_confirmados: []
			};
		}

		function salvar_estado(estado) {
			sessionStorage.setItem("estado_hotel", JSON.stringify(estado));
		}

		function formatar_moeda(valor) {
			return valor.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
		}

		function ler_texto(mensagem) {
			var entrada = prompt(mensagem);
			return entrada ? entrada.trim() : "";
		}

		function ler_inteiro(mensagem) {
			var texto = ler_texto(mensagem).replace(",", ".");
			var num = texto === "" ? NaN : Number(texto);
			return Number.isInteger(num) ? num : NaN;
		}

		function ler_confirmacao(mensagem) {
			while (true) {
				var resp = ler_texto(mensagem).toUpperCase();
				if (resp === "S" || resp === "N") return resp;
				alert("Responda apenas com S ou N.");
			}
		}

		function normalizar_dia(texto) {
			return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
		}

		function voltar_menu() {
			window.location.href = "index.html";
		}

		function eventos() {
			var estado = obter_estado();

			// Parte A — Capacidade e seleção de auditório
			var convidados = ler_inteiro("HOTEL " + NOME_HOTEL + " - [Eventos]\nInforme o número de convidados:");
			if (isNaN(convidados) || convidados < 0 || convidados > 350) {
				alert("Número de convidados inválido");
				voltar_menu();
				return;
			}

			var auditorio = "";
			var cadeiras_extras = 0;

			if (convidados <= 220) {
				auditorio = "Laranja";
				cadeiras_extras = convidados > 150 ? convidados - 150 : 0;
				var texto_cadeiras = cadeiras_extras > 0 ? " (" + cadeiras_extras + " cadeiras adicionais)" : "";
				alert("Auditório selecionado: " + auditorio + texto_cadeiras);
			} else {
				auditorio = "Colorado";
				alert("Auditório selecionado: " + auditorio);
			}

			// Parte B — Agenda e disponibilidade
			var dia = normalizar_dia(
				ler_texto("[Eventos — Agenda]\nDia da semana (segunda, terca, quarta, quinta, sexta, sabado, domingo):")
			);
			var hora_inicio = ler_inteiro("[Eventos — Agenda]\nHora inicial (inteiro, 7 a 23):");
			var duracao = ler_inteiro("[Eventos — Agenda]\nDuração do evento em horas (1 a 12):");

			var dias_uteis = ["segunda", "terca", "quarta", "quinta", "sexta"];
			var fim_de_semana = ["sabado", "domingo"];

			if (
				(!dias_uteis.includes(dia) && !fim_de_semana.includes(dia)) ||
				isNaN(hora_inicio) ||
				isNaN(duracao) ||
				duracao < 1 ||
				duracao > 12
			) {
				alert("Auditório indisponível");
				voltar_menu();
				return;
			}

			var hora_fim = hora_inicio + duracao;
			var limite = dias_uteis.includes(dia) ? 23 : 15;

			if (hora_inicio < 7 || hora_fim > limite) {
				alert("Auditório indisponível");
				voltar_menu();
				return;
			}

			var empresa = "";
			while (empresa === "") {
				empresa = ler_texto("[Eventos — Agenda]\nInforme o nome da empresa contratante:");
				if (empresa === "") alert("Informe o nome da empresa.");
			}

			alert("Auditório reservado para " + empresa + ": " + dia + " às " + hora_inicio + "hs");

			// Parte C — Equipe de garçons
			var total_garcons = Math.ceil(convidados / 12) + Math.floor(duracao / 2);
			var custo_garcons = total_garcons * duracao * 10.50;

			// Parte D — Buffet
			var cafe = convidados * 0.2;
			var agua = convidados * 0.5;
			var salgados = convidados * 7;
			var custo_buffet = (cafe * 0.80) + (agua * 0.40) + ((salgados / 100) * 34.00);

			var total_geral = custo_garcons + custo_buffet;

			// Parte E — Relatório e decisão
			var relatorio =
				"[Eventos — Relatório Técnico]\n\n" +
				"Auditório: " + auditorio + "\n" +
				"Empresa: " + empresa + "\n" +
				"Data/Horário: " + dia + " (" + hora_inicio + "h às " + hora_fim + "h)\n" +
				"Convidados: " + convidados + "\n" +
				"Garçons necessários: " + total_garcons + "\n" +
				"Duração: " + duracao + "h\n" +
				"Custo com garçons: " + formatar_moeda(custo_garcons) + "\n\n" +
				"Buffet:\n" +
				"Café: " + cafe.toFixed(1) + " L\n" +
				"Água: " + agua.toFixed(1) + " L\n" +
				"Salgados: " + salgados + " un\n" +
				"Custo buffet: " + formatar_moeda(custo_buffet) + "\n\n" +
				"Total geral: " + formatar_moeda(total_geral) + "\n\n" +
				"Confirmar reserva? (S/N)";

			var confirmar = ler_confirmacao(relatorio);
			if (confirmar === "S") {
				estado.eventos_confirmados.push({
					auditorio: auditorio,
					empresa: empresa,
					dia: dia,
					hora_inicio: hora_inicio,
					hora_fim: hora_fim,
					total: total_geral
				});
				salvar_estado(estado);
				alert("Reserva efetuada com sucesso.");
			} else {
				alert("Reserva não efetuada.");
			}

			voltar_menu();
		}

		window.onload = eventos;
	</script>
</head>

<body>

</body>

</html>
